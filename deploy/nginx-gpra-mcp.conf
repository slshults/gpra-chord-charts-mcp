# Install to /etc/nginx/sites-available/gpra-mcp and symlink into sites-enabled.
#
# This is the pre-TLS version: run certbot afterwards and it will add the
# listen 443 / ssl_certificate lines and the port-80 redirect.
#
#   sudo certbot --nginx -d mcp.guitarpracticeroutine.com
#
# AFTER certbot runs, check that the generated 443 block still carries the
# `if ($sentinel_optout)` return and the limit_req/limit_conn lines below —
# certbot rewrites the file, and an opt-out that only applies to port 80 is
# an opt-out that never fires.

# Glimind / SentinelOracle probe opt-out — https://glimind.com/opt-out
# Their documented mechanism: respond HTTP 403 with header X-Sentinel-OptOut: 1.
# Opt-outs are stated to be permanent and added to their do-not-probe list.
#
# Worth having from day one on a public MCP endpoint: this probe runs three full
# JSON-RPC handshakes every ~5.5 min (~780 req/day, several times any other
# scanner) and ignores GET /health.
# An empty default means nginx omits the header for every other client.
map $http_user_agent $sentinel_optout {
    default "";
    "~*SentinelOracle" "1";
}

# Rate limiting. This subdomain is a separate server block, so the Flask app's
# Redis limiter does not cover it — without this, an unauthenticated flood of
# cheap POSTs competes for the box's single vCPU with production Flask,
# Postgres and Redis. 10 r/s sustained with a burst of 20 is far above any
# real assistant's usage and far below what would hurt.
limit_req_zone $binary_remote_addr zone=gpra_mcp_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gpra_mcp_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.guitarpracticeroutine.com;

    add_header X-Sentinel-OptOut $sentinel_optout always;
    if ($sentinel_optout) {
        return 403;
    }

    limit_req zone=gpra_mcp_req burst=20 nodelay;
    limit_conn gpra_mcp_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    # The app caps JSON bodies at 256kb; stop oversized ones at the edge.
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:2112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP can hold a response open for SSE; don't let nginx
        # buffer it or cut it short.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
